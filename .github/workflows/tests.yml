name: tests

# run the checks on every push to any branch and on every pull request
on:
  push:
  pull_request:

# the jobs only read the code, so the token github gives them can do nothing else
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: install
        run: pip install -r requirements.txt
      - name: test
        run: python -m pytest -q tests

  # the command center's storage against a real mysql 8.0, the same family as huawei cloud rds for mysql
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.44
        env:
          MYSQL_ROOT_PASSWORD: test-only
          MYSQL_DATABASE: neuse_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptest-only"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: install
        run: pip install -r requirements.txt
      - name: test against mysql
        env:
          NEUSE_TEST_MYSQL_URL: mysql://root:test-only@127.0.0.1:3306/neuse_test
          NEUSE_TEST_MYSQL_REQUIRED: "1"
        # only the mysql half, and any skip fails the job, so a pass means mysql really was used
        run: python -m pytest -q tests/test_store_backends.py -k mysql -rs -W error::pytest.PytestWarning

  # builds the deployment image and checks it answers and stores a sighting
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build
        run: docker build -f deploy/Dockerfile -t neuse-command-center .
      - name: compose file is valid
        run: cp deploy/.env.example deploy/.env && docker compose -f deploy/docker-compose.yml config --quiet
      - name: run and check
        run: |
          docker run -d --name cc -p 8000:8000 -e NEUSE_CC_TOKEN=ci-token-0123456789abcdef neuse-command-center
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/api/v1/health && break; sleep 1; done
          now=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)
          body="{\"sent_at\": \"$now\", \"detections\": [{\"uid\": \"$(printf 'a%.0s' {1..32})\", \"unit_id\": \"unit-1\", \"timestamp\": \"$now\", \"latitude\": -1.28, \"longitude\": 36.8}]}"
          curl -fs -H "Authorization: Bearer ci-token-0123456789abcdef" -H "Content-Type: application/json" -d "$body" http://127.0.0.1:8000/api/v1/detections | tee reply.json
          grep -q '"accepted":\["aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"\]' reply.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/units)" = "401"
          curl -fs -H "Authorization: Bearer ci-token-0123456789abcdef" http://127.0.0.1:8000/api/v1/units | grep -q '"detections":1'
          # the protective headers are on every reply
          curl -sI http://127.0.0.1:8000/ | grep -qi "content-security-policy"
          # a short token is refused when the command center opens to a network
          ! docker run --rm -e NEUSE_CC_TOKEN=short neuse-command-center
          docker logs cc

  # known vulnerabilities in every package the unit and the command center install, the same way the image does
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: install as the image does
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r command_center/requirements.txt
          pip install --no-deps -r command_center/requirements-smn.txt
          pip install pip-audit
      - name: audit
        run: pip-audit --skip-editable
