<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuSE Command Center</title>
    <!-- leaflet map library, pinned with integrity hashes so a changed copy is refused -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        :root {
            --bg: #1B191A;
            --text: #FEFEFE;
            --muted: rgba(254, 254, 254, 0.55);
            --border: rgba(254, 254, 254, 0.12);
            --card: rgba(254, 254, 254, 0.03);
            --online: #4ADE80;
            --offline: #9CA3AF;
            --fresh: #F87171;
            --recent: #FB923C;
            --old: #FACC15;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 4px 12px;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
        }

        h1 { font-size: 18px; font-weight: 600; }

        .summary { font-size: 13px; color: var(--muted); }

        main { flex: 1; display: flex; min-height: 0; min-width: 0; }

        #map { flex: 1; min-height: 300px; }

        aside {
            width: 340px;
            border-left: 1px solid var(--border);
            overflow-y: auto;
            padding: 16px;
        }

        h2 {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--muted);
            margin: 4px 0 10px;
        }

        .unit, .hit {
            border: 1px solid var(--border);
            background: var(--card);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
            font-size: 13px;
            cursor: pointer;
        }

        .unit-name { font-weight: 600; display: flex; align-items: center; gap: 8px; }

        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

        .meta { color: var(--muted); margin-top: 4px; line-height: 1.5; }

        .backlog { color: var(--recent); }

        .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin-bottom: 16px; }

        .legend span { display: flex; align-items: center; gap: 6px; }

        .empty { color: var(--muted); font-size: 13px; margin-bottom: 16px; }

        #login {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 16px;
        }

        #login form {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 24px;
            width: 100%;
            max-width: 360px;
        }

        #login p { font-size: 13px; color: var(--muted); margin: 8px 0 16px; }

        #login input, #login button {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        #login input { border: 1px solid var(--border); background: var(--card); color: var(--text); margin-bottom: 10px; }

        #login button { border: none; background: var(--text); color: var(--bg); font-weight: 600; cursor: pointer; }

        @media (max-width: 760px) {
            main { flex-direction: column; }
            #map { flex: none; height: 55vh; }
            aside { width: 100%; border-left: none; border-top: 1px solid var(--border); }
            header { padding: 12px 16px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>NeuSE Command Center</h1>
        <div class="summary" id="summary">Connecting...</div>
    </header>

    <main>
        <div id="map"></div>
        <aside>
            <div class="legend">
                <span><i class="dot" style="background: var(--online)"></i>Unit online</span>
                <span><i class="dot" style="background: var(--offline)"></i>Unit offline</span>
                <span><i class="dot" style="background: var(--fresh)"></i>Person, last 5 min</span>
                <span><i class="dot" style="background: var(--recent)"></i>Last hour</span>
                <span><i class="dot" style="background: var(--old)"></i>Older</span>
            </div>
            <h2>Units</h2>
            <div id="units"><div class="empty">No units have reported yet.</div></div>
            <h2>Latest people found</h2>
            <div id="hits"><div class="empty">No detections yet.</div></div>
        </aside>
    </main>

    <div id="login">
        <form id="login-form">
            <h1>Command center token</h1>
            <p>Detections show where people are, so this page needs the token set on the server.</p>
            <input type="password" id="token" autocomplete="current-password" placeholder="Token" required>
            <button type="submit">Open</button>
        </form>
    </div>

    <script>
        // a unit counts as online when heard from within this many seconds, the same rule as the server
        const onlineWindow = {{ online_window }};
        // running number of the last detection received, so each refresh only asks for newer arrivals
        // arrival order matters, units send their backlog newest first after a link comes back
        let after = null;
        const detections = new Map();
        const unitMarkers = new Map();
        const hitMarkers = new Map();
        let fitted = false;

        const map = L.map('map', { zoomControl: true }).setView([0, 20], 3);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        function token() {
            try { return sessionStorage.getItem('neuse-token') || ''; } catch (e) { return ''; }
        }

        function askForToken() {
            document.getElementById('login').style.display = 'flex';
            document.getElementById('token').focus();
        }

        document.getElementById('login-form').addEventListener('submit', (event) => {
            event.preventDefault();
            try { sessionStorage.setItem('neuse-token', document.getElementById('token').value); } catch (e) {}
            document.getElementById('login').style.display = 'none';
            refresh();
        });

        async function api(path) {
            const headers = token() ? { 'Authorization': 'Bearer ' + token() } : {};
            const response = await fetch(path, { headers });
            if (response.status === 401) {
                askForToken();
                throw new Error('token needed');
            }
            if (!response.ok) throw new Error('server answered ' + response.status);
            return response.json();
        }

        // text from units goes in with textContent only, never as html
        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined) node.textContent = text;
            return node;
        }

        function ago(iso) {
            if (!iso) return 'never';
            const seconds = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
            if (seconds < 60) return Math.round(seconds) + ' s ago';
            if (seconds < 3600) return Math.round(seconds / 60) + ' min ago';
            if (seconds < 86400) return Math.round(seconds / 3600) + ' h ago';
            return Math.round(seconds / 86400) + ' d ago';
        }

        function ageColour(iso) {
            const minutes = (Date.now() - new Date(iso).getTime()) / 60000;
            const name = minutes < 5 ? '--fresh' : minutes < 60 ? '--recent' : '--old';
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }

        function unitColour(unit) {
            return getComputedStyle(document.documentElement).getPropertyValue(unit.online ? '--online' : '--offline').trim();
        }

        function drawUnits(units) {
            const list = document.getElementById('units');
            list.replaceChildren();
            if (!units.length) list.append(el('div', 'empty', 'No units have reported yet.'));

            for (const unit of units) {
                const card = el('div', 'unit');
                const name = el('div', 'unit-name');
                const dot = el('i', 'dot');
                dot.style.background = unitColour(unit);
                name.append(dot, el('span', '', unit.unit_id));
                const meta = el('div', 'meta');
                meta.append(el('div', '', (unit.online ? 'Online' : 'Offline') + ', last heard ' + ago(unit.last_contact)));
                meta.append(el('div', '', unit.detections + ' people found' + (unit.detector ? ' with ' + unit.detector : '')));
                if (unit.queued) meta.append(el('div', 'backlog', unit.queued + ' detections waiting on the unit'));
                card.append(name, meta);
                card.addEventListener('click', () => map.setView([unit.latitude, unit.longitude], 17));
                list.append(card);

                // one marker per unit, moved as the unit reports new positions
                let marker = unitMarkers.get(unit.unit_id);
                if (!marker) {
                    marker = L.circleMarker([unit.latitude, unit.longitude], { radius: 9, weight: 3, fillOpacity: 0.25 }).addTo(map);
                    unitMarkers.set(unit.unit_id, marker);
                }
                marker.setLatLng([unit.latitude, unit.longitude]);
                marker.setStyle({ color: unitColour(unit), fillColor: unitColour(unit) });
                marker.bindTooltip(unit.unit_id + (unit.online ? ' online' : ' offline'));
            }
        }

        function drawHits() {
            const sorted = [...detections.values()].sort((a, b) => b.timestamp_utc.localeCompare(a.timestamp_utc));

            for (const hit of sorted) {
                let marker = hitMarkers.get(hit.uid);
                if (!marker) {
                    marker = L.circleMarker([hit.latitude, hit.longitude], { radius: 5, weight: 1, fillOpacity: 0.8 }).addTo(map);
                    const label = hit.unit_id + ', ' + new Date(hit.timestamp).toLocaleString() +
                        (hit.confidence !== null ? ', confidence ' + hit.confidence.toFixed(2) : '');
                    marker.bindTooltip(label);
                    hitMarkers.set(hit.uid, marker);
                }
                // colours age as time passes, even with no new data
                marker.setStyle({ color: ageColour(hit.timestamp_utc), fillColor: ageColour(hit.timestamp_utc) });
            }

            const list = document.getElementById('hits');
            list.replaceChildren();
            if (!sorted.length) list.append(el('div', 'empty', 'No detections yet.'));
            for (const hit of sorted.slice(0, 25)) {
                const card = el('div', 'hit');
                card.append(el('div', 'unit-name', hit.unit_id));
                card.append(el('div', 'meta', ago(hit.timestamp_utc) +
                    (hit.confidence !== null ? ', confidence ' + hit.confidence.toFixed(2) : '') +
                    ', ' + hit.latitude.toFixed(5) + ', ' + hit.longitude.toFixed(5)));
                card.addEventListener('click', () => map.setView([hit.latitude, hit.longitude], 18));
                list.append(card);
            }
        }

        function fitOnce() {
            // zoom to everything the first time there is something to show
            if (fitted) return;
            const points = [...unitMarkers.values(), ...hitMarkers.values()].map(m => m.getLatLng());
            if (!points.length) return;
            map.fitBounds(L.latLngBounds(points).pad(0.3), { maxZoom: 17 });
            fitted = true;
        }

        async function refresh() {
            try {
                const unitData = await api('/api/v1/units');
                // keep asking until caught up, a long backlog can arrive at once
                while (true) {
                    const query = after === null ? '' : '?after=' + after;
                    const hitData = await api('/api/v1/detections' + query);
                    for (const hit of hitData.detections) {
                        detections.set(hit.uid, hit);
                        if (after === null || hit.seq > after) after = hit.seq;
                    }
                    if (hitData.detections.length < 1000) break;
                }
                drawUnits(unitData.units);
                drawHits();
                fitOnce();
                const online = unitData.units.filter(u => u.online).length;
                document.getElementById('summary').textContent =
                    online + ' of ' + unitData.units.length + ' units online, ' + unitData.detections + ' people found';
            } catch (e) {
                document.getElementById('summary').textContent = 'Waiting for the server';
            }
        }

        refresh();
        setInterval(refresh, 5000);
    </script>
</body>
</html>
