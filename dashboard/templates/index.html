<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuSE · Edge Telemetry Console</title>
    <style>
        :root {
            --bg: #1B191A;
            --text: #FEFEFE;
            --muted: rgba(254, 254, 254, 0.55);
            --border: rgba(254, 254, 254, 0.12);
            --card: rgba(254, 254, 254, 0.03);
            --card-hover: rgba(254, 254, 254, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            padding: 48px 24px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* style the header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 32px;
        }

        .brand-title {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .brand-sub {
            font-size: 13px;
            color: var(--muted);
            margin-top: 2px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--card);
            font-size: 13px;
            font-weight: 500;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--text);
            box-shadow: 0 0 8px rgba(254, 254, 254, 0.8);
        }

        /* lay out the metrics */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .metric-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .metric-card:hover {
            background: var(--card-hover);
            border-color: rgba(254, 254, 254, 0.25);
        }

        .metric-label {
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .metric-value {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        /* style the telemetry table */
        .table-wrapper {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th {
            background: rgba(254, 254, 254, 0.02);
            padding: 14px 18px;
            font-weight: 500;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
            font-size: 12px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: var(--card-hover);
        }

        .empty-row {
            text-align: center;
            color: var(--muted);
            padding: 32px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <div class="brand-title">NeuSE</div>
                <div class="brand-sub">Neural Sentinel Edge · Search &amp; Rescue Telemetry</div>
            </div>
            <div class="status-pill">
                <span id="system-status">Connecting...</span>
            </div>
        </header>

        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label">Detector</div>
                <div class="metric-value" id="detector-name">—</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Avg. Processing Time</div>
                <div class="metric-value" id="avg-latency">—</div>
            </div>
            <div class="metric-card">
                <div class="metric-label">Total Detections</div>
                <div class="metric-value" id="detection-count">0</div>
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Timestamp</th>
                        <th>Coordinates</th>
                        <th>Confidence</th>
                        <th>Peak Intensity</th>
                    </tr>
                </thead>
                <tbody id="telemetry-body">
                    <tr>
                        <td colspan="5" class="empty-row">Connecting to the local pipeline...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

<script>
        // check for telemetry every two seconds
        async function updateTelemetry() {
            try {
                const res = await fetch('/api/telemetry');
                const json = await res.json();

                // update the metrics and show a dash for anything not measured yet
                document.getElementById('detector-name').textContent = json.detector || '—';
                document.getElementById('avg-latency').textContent =
                    typeof json.avg_latency_ms === 'number' ? json.avg_latency_ms.toFixed(1) + ' ms' : '—';
                document.getElementById('detection-count').textContent = json.total || 0;
                document.getElementById('system-status').textContent = 'Local node online';

                const body = document.getElementById('telemetry-body');
                body.replaceChildren();

                if (!json.data || json.data.length === 0) {
                    const row = body.insertRow();
                    const cell = row.insertCell();
                    cell.colSpan = 5;
                    cell.className = 'empty-row';
                    cell.textContent = 'No detections logged yet.';
                    return;
                }

                // use textContent so saved values are never treated as html
                const fmt = (value, digits) => typeof value === 'number' ? value.toFixed(digits) : '—';
                for (const item of json.data) {
                    const conf = typeof item.confidence === 'number'
                        ? (item.confidence * 100).toFixed(1) + '%'
                        : 'n/a (baseline)';
                    const cells = [
                        '#' + item.id,
                        (item.timestamp || '').replace('T', ' '),
                        fmt(item.latitude, 5) + ', ' + fmt(item.longitude, 5),
                        conf,
                        typeof item.thermal_peak === 'number' ? item.thermal_peak + ' / 255' : '—',
                    ];
                    const row = body.insertRow();
                    for (const text of cells) {
                        row.insertCell().textContent = text;
                    }
                }
            } catch (err) {
                console.error("Dashboard telemetry error:", err);
                document.getElementById('system-status').innerText = 'Offline / Waiting';
            }
        }

        setInterval(updateTelemetry, 2000);
        updateTelemetry();
    </script>
</body>
</html>
